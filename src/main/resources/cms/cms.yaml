kind: "CMS"
form:
  - type: "CheckBox"
    name: "inheritConfig"
    label: "Inherit config from main site"
    helpText: "Use configuration from main site when sites are nested."
    occurrences:
      min: 0
      max: 1
    alignment: "left"
    default: "unchecked"
  - type: "CheckBox"
    name: "useConfigFile"
    label: "Use config file instead of site config."
    helpText: "Use configuration from file in $XP_HOME/config/no.bouvet.app.security-headers.cfg\
      \ instead of the parameters specified in site config."
    occurrences:
      min: 0
      max: 1
  - type: "ItemSet"
    name: "strictTransportSecurity"
    label: "Strict-Transport-Security"
    helpText: "HTTP Strict Transport Security (HSTS) is a web security policy mechanism\
      \ which helps to protect websites against protocol downgrade attacks and cookie\
      \ hijacking. It allows web servers to declare that web browsers (or other complying\
      \ user agents) should only interact with it using secure HTTPS connections,[1]\
      \ and never via the insecure HTTP protocol. HSTS is an IETF standards track\
      \ protocol and is specified in RFC 6797"
    occurrences:
      min: 0
      max: 1
    items:
      - type: "Long"
        name: "maxAge"
        label: "Strict-Transport-Security max-age"
        helpText: "The time, in seconds, that the browser should remember that a site\
          \ is only to be accessed using HTTPS."
        occurrences:
          min: 0
          max: 1
        default: 31536000
      - type: "CheckBox"
        name: "includeSubdomains"
        label: "Include subdomains"
        helpText: "If this optional parameter is specified, this rule applies to all\
          \ of the site's subdomains as well."
        occurrences:
          min: 0
          max: 1
      - type: "CheckBox"
        name: "preload"
        label: "Preload"
        helpText: "Google maintains an HSTS preload service. By following the guidelines\
          \ and successfully submitting your domain, browsers will never connect to\
          \ your domain using an insecure connection. While the service is hosted\
          \ by Google, all browsers have stated an intent to use (or actually started\
          \ using) the preload list. However, it is not part of the HSTS specification\
          \ and should not be treated as official."
        occurrences:
          min: 0
          max: 1
  - type: "ItemSet"
    name: "contentSecurityPolicy"
    label: "Content-Security-Policy"
    helpText: "Content Security Policy (CSP) is an added layer of security that helps\
      \ to detect and mitigate certain types of attacks, including Cross Site Scripting\
      \ (XSS) and data injection attacks. These attacks are used for everything from\
      \ data theft to site defacement or distribution of malware. Read more about\
      \ CSP at https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP ."
    occurrences:
      min: 0
      max: 1
    items:
      - type: "OptionSet"
        name: "commonDirectives"
        expanded: false
        label: "Common Directives"
        occurrences:
          min: 1
          max: 1
        options:
          - name: "default-src"
            label: "default-src"
            helpText: "Serves as a fallback for the other fetch directives. https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/default-src"
            selected: true
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
          - name: "base-uri"
            label: "base-uri"
            helpText: "Restricts the URLs which can be used in a document's <base>\
              \ element. Not setting this allows any URL (no fallback)."
            selected: true
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
          - name: "form-action"
            label: "form-action"
            helpText: "Restricts the URLs which can be used as the target of a form\
              \ submissions from a given context. Not setting this allows anything\
              \ (no fallback). Warning: Whether form-action should block redirects\
              \ after a form submission is debated and browser implementations of\
              \ this aspect are inconsistent. See more at https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/form-action"
            selected: true
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
          - name: "object-src"
            label: "object-src"
            helpText: "Specifies valid sources for the <object>, <embed>, and <applet>\
              \ elements. Defaults back to default-src, but it is recommended to restrict\
              \ this fetch-directive (e.g. explicitly set object-src 'none' if possible)\
              \ as elements controlled by object-src are perhaps coincidentally considered\
              \ legacy HTML elements and aren't receiving new standardized features\
              \ (such as the security attributes sandbox or allow for <iframe>). See\
              \ more at https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/object-src"
            selected: true
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'none'"
          - name: "script-src"
            label: "script-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
          - name: "font-src"
            label: "font-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self' data:"
          - name: "frame-src"
            label: "frame-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
          - name: "img-src"
            label: "img-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self' data:"
          - name: "media-src"
            label: "media-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self' data:"
          - name: "style-src"
            label: "style-src"
            items:
              - type: "TextArea"
                name: "directiveValues"
                label: "Directive values"
                occurrences:
                  min: 0
                  max: 1
                default: "'self'"
        selection:
          min: 0
          max: 0
      - type: "ItemSet"
        name: "extraDirectives"
        label: "Extra directives"
        occurrences:
          min: 0
          max: 0
        items:
          - type: "TextLine"
            name: "directiveName"
            label: "Directive Name"
            occurrences:
              min: 0
              max: 1
          - type: "TextArea"
            name: "directiveValues"
            label: "Directive Values"
            occurrences:
              min: 0
              max: 1
  - type: "OptionSet"
    name: "xFrameOptions"
    expanded: true
    label: "X-Frame-Options"
    helpText: "The X-Frame-Options HTTP response header can be used to indicate whether\
      \ or not a browser should be allowed to render a page in a <frame>, <iframe>\
      \ or <object> . Sites can use this to avoid clickjacking attacks, by ensuring\
      \ that their content is not embedded into other sites. Full description of all\
      \ the options available at https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options"
    occurrences:
      min: 0
      max: 1
    options:
      - name: "deny"
        label: "DENY"
        helpText: "The page can only be displayed in a frame on the same origin as\
          \ the page itself."
      - name: "sameorigin"
        label: "SAMEORIGIN"
        helpText: "The page cannot be displayed in a frame, regardless of the site\
          \ attempting to do so."
      - name: "allowFrom"
        label: "ALLOW-FROM"
        helpText: "Obsolete directive that no longer works in modern browsers. From\
          \ MDN link (see help-text for X-Frame-Options): \"Don't use it.\""
        items:
          - type: "TextLine"
            name: "uri"
            label: "ALLOW-FROM uri"
            helpText: "The page can only be displayed in a frame on the specified\
              \ origin. Note that in Firefox it doesn't check the frame ancestors\
              \ to see if they are in the same origin."
            occurrences:
              min: 0
              max: 1
    selection:
      min: 1
      max: 1
  - type: "OptionSet"
    name: "xXssProtection"
    expanded: true
    label: "X-XSS-Protection"
    helpText: "If you do not need to support legacy browsers, it is recommended that\
      \ you use Content-Security-Policy without allowing unsafe-inline scripts instead\
      \ of using this, as \"XSS protection can create XSS vulnerabilities in otherwise\
      \ safe websites\" - see https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection.The\
      \ HTTP X-XSS-Protection response header is a feature of Internet Explorer, Chrome\
      \ and Safari that stops pages from loading when they detect reflected cross-site\
      \ scripting (XSS) attacks. Although these protections are largely unnecessary\
      \ in modern browsers when sites implement a strong Content-Security-Policy that\
      \ disables the use of inline JavaScript ('unsafe-inline'), they can still provide\
      \ protections for users of older web browsers that don't yet support CSP."
    occurrences:
      min: 0
      max: 1
    options:
      - name: "xss_0"
        label: "Disabled (0)"
        helpText: "Disables XSS filtering"
      - name: "xss_1"
        label: "Enabled (1)"
        helpText: "Enables XSS filtering (usually default in browsers). If a cross-site\
          \ scripting attack is detected, the browser will sanitize the page (remove\
          \ the unsafe parts)."
        selected: true
      - name: "xss_1_block"
        label: "Enabled, block mode (1; mode=block)"
        helpText: "Enables XSS filtering. Rather than sanitizing the page, the browser\
          \ will prevent rendering of the page if an attack is detected."
      - name: "xss_1_report"
        label: "Enabled, report mode (1; report=report_url) (Chromium only)"
        helpText: "Enables XSS filtering. If a cross-site scripting attack is detected,\
          \ the browser will sanitize the page and report the violation. This uses\
          \ the functionality of the CSP report-uri directive to send a report."
        items:
          - type: "TextLine"
            name: "url"
            label: "Report URL"
            occurrences:
              min: 0
              max: 1
    selection:
      min: 1
      max: 1
  - type: "ItemSet"
    name: "xContentTypeOptions"
    label: "X-Content-Type-Options"
    helpText: "The X-Content-Type-Options response HTTP header is a marker used by\
      \ the server to indicate that the MIME types advertised in the Content-Type\
      \ headers should not be changed and be followed. This allows to opt-out of MIME\
      \ type sniffing, or, in other words, it is a way to say that the webmasters\
      \ knew what they were doing."
    occurrences:
      min: 0
      max: 1
    items:
      - type: "TextLine"
        name: "value"
        label: "X-Content-Type-Options"
        occurrences:
          min: 0
          max: 1
        default: "nosniff"
  - type: "ItemSet"
    name: "referrerPolicy"
    label: "Referrer-Policy"
    helpText: "The Referrer-Policy HTTP header governs which referrer information,\
      \ sent in the Referer header, should be included with requests made."
    occurrences:
      min: 0
      max: 1
    items:
      - type: "RadioButton"
        name: "referrerPolicy"
        label: "Referrer-Policy"
        helpText: "Full description of the options at https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy"
        occurrences:
          min: 0
          max: 1
        options:
          - value: "no-referrer"
            label: "no-referrer"
          - value: "no-referrer-when-downgrade"
            label: "no-referrer-when-downgrade"
          - value: "origin"
            label: "origin"
          - value: "origin-when-cross-origin"
            label: "origin-when-cross-origin"
          - value: "same-origin"
            label: "same-origin"
          - value: "strict-origin"
            label: "strict-origin"
          - value: "strict-origin-when-cross-origin"
            label: "strict-origin-when-cross-origin"
          - value: "unsafe-url"
            label: "unsafe-url"
        default: "no-referrer"
  - type: "ItemSet"
    name: "permissionsPolicy"
    label: "Permissions-Policy"
    helpText: "The HTTP Permissions-Policy header provides a mechanism to allow and\
      \ deny the use of browser features in a document or within any <iframe> elements\
      \ in the document. To allow features for <iframe> the feature must be enabled\
      \ both in the header and by using the 'allow' attribute on the <iframe>. For\
      \ more information, see https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy."
    occurrences:
      min: 0
      max: 1
    items:
      - type: "TextArea"
        name: "policy"
        label: "Policy"
        helpText: "Syntax: <directive>=<allowlist>. Example: geolocation=() (block\
          \ all access to geolocation). For list of directives, see https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy#directives."
        occurrences:
          min: 0
          max: 1
